<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ButcherBridge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="header"><div class="wrap header-inner">
    <a class="brand" href="{{ url_for('home') }}"><span class="logo">BB</span>
    <span>ButcherBridge<small>Smarter group procurement</small></span></a>
    <nav aria-label="Main navigation"><a href="{{ url_for('home') }}">Dashboard</a></nav>
  </div></header>
  <main class="wrap" id="main">{% block content %}{% endblock %}</main>
  <footer class="footer">ButcherBridge · BFB 321 Semester Project · Demonstration data only</footer>
</body></html>
